<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChatGPT Status Dot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div><h1>Status Dot<span class="brand-dot" aria-hidden="true"></span></h1><p class="subtitle">for ChatGPT</p></div>
    <label class="toggle">
      <span>Enabled</span>
      <input id="enabled" type="checkbox" role="switch" disabled>
      <span class="switch" aria-hidden="true"></span>
    </label>
  </header>

  <section class="preview" aria-label="Tab preview">
    <div class="preview-caption">Tab preview</div>
    <div class="tab-strip" aria-hidden="true">
      <div class="tab">
        <span class="tab-icon"><svg viewBox="0 0 20 20"><path d="M5 4h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9l-4 3v-3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M7 8h6M7 11h4"/></svg><i class="dot working"></i></span>
        <span>ChatGPT</span><span class="tab-close">×</span>
      </div>
      <div class="tab">
        <span class="tab-icon"><svg viewBox="0 0 20 20"><path d="M5 4h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9l-4 3v-3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M7 8h6M7 11h4"/></svg><i class="dot done"></i></span>
        <span>ChatGPT</span><span class="tab-close">×</span>
      </div>
    </div>
    <div class="preview-labels"><span>Working</span><span>Done</span></div>
  </section>

  <main>
    <div class="section-heading">
      <h2>Dot colors</h2>
      <button id="reset" type="button" disabled title="Restore default colors and enable the indicator">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 7a6 6 0 1 1 0 6M4 3v4h4"/></svg>Reset defaults
      </button>
    </div>
    <div class="colors">
      <label class="color-row" for="color">
        <span><span class="color-name">Working</span><span class="color-description">Response in progress</span></span>
        <input id="color" type="color" value="#91acf2" aria-label="Working dot color" title="Change Working color" disabled>
      </label>
      <label class="color-row" for="doneColor">
        <span><span class="color-name">Done</span><span class="color-description">Finished in the background</span></span>
        <input id="doneColor" type="color" value="#65d6a0" aria-label="Done dot color" title="Change Done color" disabled>
      </label>
    </div>
    <p class="hint">Done clears when you return to the chat.</p>
  </main>

  <footer class="status-line" data-state="idle">
    <span class="status-dot" aria-hidden="true"></span>
    <p id="status" role="status">Checking current tab…</p>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
